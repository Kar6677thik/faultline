[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "faultline"
version = "0.1.0"
description = "Evidence-based adversarial correctness experiments for backend applications"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "docker>=7.1,<8",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
faultline = "faultline.cli:app"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: creates isolated Docker resources (opt in with FAULTLINE_INTEGRATION=1)"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/faultline"]
