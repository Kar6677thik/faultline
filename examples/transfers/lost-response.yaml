          "currency": "INR"
        }
      },
      "timeout_ms": 2000,
      "retry": {
        "max_attempts": 2,
        "on": [
          "timeout"
        ],
        "backoff_ms": [
          100
        ]
      }
    }
  ],
  "invariants": [
    "transfers.conservation",
    "transfers.atomicity",
    "transfers.idempotency_contract",
    "transfers.completed_transfer"
  ],
  "faults": [
    {
      "id": "hide_first_response",
      "kind": "response_suppress",
      "target": "transfers_api",
